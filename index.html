<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akshaya Institutions - Interactive Campus Navigation & Location Pages</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="appRoot">

    <!-- Top Application Header -->
    <header id="appHeader">
      <!-- Institutional Branding -->
      <div class="brand-section">
        <div class="brand-logo">A</div>
        <div class="brand-title-wrap">
          <h1>
            AKSHAYA INSTITUTIONS
            <span class="brand-tag">Autonomous</span>
          </h1>
          <p class="brand-subtitle">Campus Navigation & Official Floor Directory</p>
        </div>
      </div>

      <!-- Navigation View Switcher (Map vs Route vs Location Pages) -->
      <nav class="view-nav-tabs">
        <button id="navTabMap" class="nav-view-btn active" data-tab="map">
          <span>🗺️</span>
          <span class="nav-text">Campus Map</span>
        </button>
        <button id="navTabRoute" class="nav-view-btn" data-tab="route">
          <span>🧭</span>
          <span class="nav-text">Directions & Routing</span>
        </button>
        <button id="navTabPages" class="nav-view-btn" data-tab="pages">
          <span>🏛️</span>
          <span class="nav-text">Location Pages</span>
        </button>
      </nav>

      <!-- Search Input with Autocomplete -->
      <div class="search-container" id="searchWrapper">
        <div class="search-input-wrap">
          <span style="font-size: 13px; color: #9ca3af;">🔍</span>
          <input 
            id="searchInput" 
            type="text" 
            placeholder="Search block, lab, court, #1-31..." 
            autocomplete="off"
          />
        </div>
        <div id="searchResultsDropdown" class="search-dropdown hidden"></div>
      </div>

      <!-- Emergency Assistance -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <a href="tel:+914259242570" style="color: #9ca3af; text-decoration: none; font-size: 11px; display: flex; align-items: center; gap: 4px; padding: 6px 10px; background: rgba(31, 41, 55, 0.6); border: 1px solid #374151; border-radius: 8px;">
          <span>📞</span>
          <span style="display: none; @media(min-width: 1024px){display: inline;}">Gate: +91 4259 242570</span>
        </a>
      </div>
    </header>

    <!-- Main Workspace Area -->
    <div id="workspace">

      <!-- Left Sidebar: Route Planner & Directory -->
      <aside id="sidebarPanel">
        
        <!-- Sidebar Panel Switcher -->
        <div class="panel-header">
          <span id="panelModeTitle" class="panel-title">🧭 Campus Routing</span>
          <button id="btnToggleSidebarTab" class="btn-secondary" style="padding: 4px 8px; font-size: 11px;">
            Switch to Directory
          </button>
        </div>

        <!-- 1. Route Navigation Section -->
        <div id="routePlannerSection" style="display: flex; flex-direction: column; height: 100%;">
          
          <!-- Origin & Destination Inputs Card -->
          <div class="route-inputs-card">
            <div class="route-input-group">
              <span class="route-dot" style="color: #10b981;">🟢</span>
              <div class="route-select-wrap">
                <label class="route-label">START POINT</label>
                <select id="fromSelect" class="route-select"></select>
              </div>
            </div>

            <button id="btnSwapRoute" class="btn-swap-route" title="Reverse Route">⇅</button>

            <div class="route-input-group">
              <span class="route-dot" style="color: #ef4444;">🔴</span>
              <div class="route-select-wrap">
                <label class="route-label">DESTINATION</label>
                <select id="toSelect" class="route-select"></select>
              </div>
            </div>

            <div class="route-buttons-row">
              <button id="btnFindRoute" class="btn-primary">
                <span>🚀 Find Shortest Path</span>
              </button>
              <button id="btnClearRoute" class="btn-secondary">Clear</button>
            </div>

            <!-- Popular Route Quick Buttons -->
            <div class="presets-section">
              <span class="presets-label">Popular Trips:</span>
              <div class="presets-grid">
                <button class="btn-preset preset-route-btn" data-from="101" data-to="25">Main Gate ➔ Auditorium</button>
                <button class="btn-preset preset-route-btn" data-from="22" data-to="24">Boys Hostel ➔ Food Court</button>
                <button class="btn-preset preset-route-btn" data-from="101" data-to="4">Main Gate ➔ Main Block</button>
                <button class="btn-preset preset-route-btn" data-from="5" data-to="11">A Block (Library) ➔ E Block</button>
                <button class="btn-preset preset-route-btn" data-from="23" data-to="17">Girls Hostel ➔ Arts & Science</button>
              </div>
            </div>
          </div>

          <!-- Route Distance & Simulation Banner -->
          <div id="routeSummaryBar" class="route-summary-bar">
            <div class="route-stats-wrap">
              <span class="stat-item" id="routeDistText">0 meters</span>
              <span style="color: #6b7280;">•</span>
              <span class="stat-item" id="routeTimeText" style="color: #cbd5e1;">0 min walk</span>
            </div>
            <button id="btnSimulateWalk" class="btn-simulate">
              <span>🚶</span>
              <span>Simulate Walk</span>
            </button>
          </div>

          <!-- Step-by-Step Guidance List -->
          <div class="turns-list" id="turnDirectionsList"></div>
        </div>

        <!-- 2. Directory Explorer Section -->
        <div id="directorySection" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
          <!-- Category Chips -->
          <div class="chips-scroll" id="categoryChips"></div>
          <!-- Locations List -->
          <div class="locations-list" id="directoryList"></div>
        </div>

      </aside>

      <!-- Center Map Canvas -->
      <main id="mapWrapper">
        <div id="mapContainer" style="width: 100%; height: 100%;"></div>

        <!-- Floating Zoom & Fit Controls -->
        <div class="map-floating-controls">
          <button id="btnZoomIn" class="map-ctrl-btn" title="Zoom In">+</button>
          <button id="btnZoomOut" class="map-ctrl-btn" title="Zoom Out">−</button>
          <button id="btnFitCampus" class="map-ctrl-btn" style="font-size: 14px;" title="Fit Whole Campus">⛶</button>
        </div>

        <!-- Campus Map Legend Bar -->
        <div class="map-legend-bar">
          <span style="font-weight: 700; color: #fff;">Legend:</span>
          <div class="legend-chip">
            <span class="legend-color" style="background: #1e40af;"></span>
            <span>Academics</span>
          </div>
          <div class="legend-chip">
            <span class="legend-color" style="background: #3730a3;"></span>
            <span>Administration</span>
          </div>
          <div class="legend-chip">
            <span class="legend-color" style="background: #ea580c;"></span>
            <span>Sports</span>
          </div>
          <div class="legend-chip">
            <span class="legend-color" style="background: #0284c7;"></span>
            <span>Dining & Hostels</span>
          </div>
          <div class="legend-chip">
            <span class="legend-color" style="background: #059669;"></span>
            <span>Main Gate</span>
          </div>
        </div>
      </main>

      <!-- Full Location Detail Page Modal -->
      <div id="locationPageModal"></div>

      <!-- Full Campus Location Pages Catalog View -->
      <div id="catalogViewContainer" class="hidden"></div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="js/campus-data.js"></script>
  <script src="js/router.js"></script>
  <script src="js/map-engine.js"></script>
  <script src="js/location-view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
